questions:
- id: Q1
  about:
    requirement: REQ-0052
    criterion: 4
  question: ¿En qué moneda se expresan las opciones de presupuesto?
  situation: eliges el rango de presupuesto de tu proyecto y después lo ves en el
    resumen previo al envío
  readings:
  - reading: los rangos de presupuesto se expresan en pesos mexicanos
    label: Pesos mexicanos
    example: 10to20k → De $10,000 a $20,000 MXN
    means: comparas las opciones con el presupuesto que tienes en pesos
  - reading: los rangos de presupuesto se expresan en dólares estadounidenses
    label: Dólares estadounidenses
    example: 10to20k → De US$10,000 a US$20,000
    means: comparas las opciones con el presupuesto que tienes en dólares
  proposal: none
  asked: 6c01ab8acb573bf31dda8cf6c188ec051eee93ad5542c1d387ffb1b733fcc0ed
  answer:
    choice: 1
    approver:
      name: MFei8ht
      role: architect
    proposal: none
- id: Q2
  about:
    requirement: REQ-0052
    criterion: 5
  question: ¿Los rangos del plazo representan meses o semanas?
  situation: eliges cuánto tiempo tienes para realizar el proyecto y después compruebas
    el plazo en el resumen
  readings:
  - reading: los rangos numerados representan meses
    label: Meses
    example: 1to3 → De 1 a 3 meses
    means: puedes seleccionar un proyecto previsto para los próximos meses
  - reading: los rangos numerados representan semanas
    label: Semanas
    example: 1to3 → De 1 a 3 semanas
    means: puedes seleccionar un proyecto previsto para las próximas semanas
  proposal: none
  asked: 6bdac7b0e71e84c22fc58bba75f962ef34f869c2d9cd5404f727fc8658fec99d
  answer:
    choice: 1
    approver:
      name: MFei8ht
      role: architect
    proposal: none
- id: Q3
  about:
    requirement: REQ-0074
    criterion: 1
  also:
  - requirement: REQ-0006
    criterion: 1
  - requirement: REQ-0146
    criterion: 1
  - requirement: REQ-0164
    criterion: 1
  question: ¿Una respuesta HTTP exitosa de la integración basta para confirmar que
    recibió la solicitud?
  situation: la integración externa responde con HTTP 200 sin contenido después de
    recibir una solicitud válida
  readings:
  - reading: el estado HTTP exitoso confirma la recepción y el producto muestra la
      solicitud como aceptada
    label: Basta el estado HTTP
    example: 'Integración: 200 sin cuerpo → producto: solicitud aceptada'
    means: ves la aceptación sin que la integración tenga que enviar un comprobante
      adicional
  - reading: el estado HTTP exitoso no basta y se exige además una confirmación explícita
      de recepción en la respuesta
    label: Exige confirmación adicional
    example: 'Integración: 200 sin cuerpo → producto: recepción no confirmada'
    means: no ves aceptación si la integración omite esa confirmación adicional
  proposal:
    choice: 1
    source: 'convention: una integración HTTP confirma el éxito de una entrega mediante
      su respuesta 2xx, salvo que se acuerde un comprobante adicional'
  asked: aa3e42e26c0baac7184ce33786a6376376d486587965635495df52c65c567368
  answer:
    choice: 1
    approver:
      name: MFei8ht
      role: architect
    proposal: accepted
- id: Q4
  about:
    requirement: REQ-0108
    criterion: 1
  also:
  - requirement: REQ-0048
    criterion: 1
  question: ¿Aceptar por voz una respuesta de la pregunta de proyecto activa abre
    la siguiente pregunta?
  situation: estás en la pregunta de presupuesto y el asistente incorpora una opción
    válida que no sustituye una edición manual
  readings:
  - reading: la respuesta se muestra como confirmada y se activa inmediatamente la
      siguiente pregunta
    label: Avanza como una selección
    example: Presupuesto activo → voz aplica un rango → Plazo activo
    means: no tienes que volver a elegir la respuesta con el teclado o el ratón para
      seguir
  - reading: la respuesta se guarda y muestra, pero la pregunta sigue activa hasta
      que haces una selección manual
    label: Guarda sin avanzar
    example: Presupuesto activo → voz aplica un rango → Presupuesto sigue activo
    means: todavía debes actuar sobre el selector para pasar a la siguiente pregunta
  proposal:
    choice: 1
    source: 'convention: una respuesta de catálogo aceptada completa la pregunta igual
      que seleccionar esa misma respuesta manualmente'
  asked: 24419aa0c227fa0a8a96524a5663c814416e2596bb1398781e15892f8e3f951f
  answer:
    choice: 1
    approver:
      name: MFei8ht
      role: architect
    proposal: accepted
- id: Q5
  about:
    requirement: REQ-0060
    criterion: 1
  also:
  - requirement: REQ-0140
    criterion: 1
  question: ¿Cómo corriges un dato después de ver el resumen?
  situation: ya has revisado tus nueve datos y solicitas corregir únicamente el teléfono
  readings:
  - reading: vuelves a una edición donde puedes corregir directamente el dato elegido
      y solicitar una nueva revisión
    label: Corrección directa
    example: Resumen → corregir teléfono → revisar otra vez
    means: no necesitas volver a confirmar las demás preguntas
  - reading: vuelves al principio del recorrido progresivo con los valores conservados
      y recorres otra vez sus pasos
    label: Repetir el recorrido
    example: Resumen → Contacto → Correo → preguntas → Mensaje → resumen
    means: debes pasar otra vez por los pasos aunque sólo cambies el teléfono
  proposal: none
  asked: 3e5a06a319633e88c2dcd3cf762ce37e4c5c58f45564a9c82cbb5cd1f471cba3
  answer:
    choice: 1
    approver:
